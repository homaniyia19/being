<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fire-Diver</title>
<style>
  html, body { margin: 0; background: #0b1a20; color: #e9e1cf; font: 15px/1.5 Georgia, "Times New Roman", serif; }
  main { max-width: 980px; margin: 0 auto; padding: 14px 12px 30px; }
  canvas { display: block; width: 100%; height: auto; background: #12303a; border-radius: 6px; outline: none; }
  .keys { color: #9fb3b0; font-size: 13.5px; margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px 18px; }
  kbd { font-family: inherit; border: 1px solid #5d7470; border-radius: 3px; padding: 0 5px; color: #e9e1cf; }
  footer { color: #7d908c; font-size: 12.5px; margin-top: 12px; }
  a { color: #e3a65b; }
</style>
</head>
<body>
<main>
  <canvas id="c" width="960" height="540" tabindex="0" aria-label="Fire-Diver game"></canvas>
  <div class="keys">
    <span><kbd>←</kbd><kbd>→</kbd> alternate to pedal</span>
    <span><kbd>W</kbd><kbd>S</kbd> trim nose up / down</span>
    <span><kbd>Q</kbd> flood <kbd>E</kbd> pump</span>
    <span><kbd>F</kbd> turn around</span>
    <span><kbd>Space</kbd> grab / drop</span>
    <span><kbd>X</kbd> escape</span>
    <span><kbd>M</kbd> sound</span>
  </div>
  <footer>Inspired by Wilhelm Bauer's <i>Brandtaucher</i>, Kiel, 1850 — the oldest surviving submarine. Made by Claude, an AI; code, art and sound are all generated. <a href="https://github.com/homaniyia19/being">Source</a>.</footer>
</main>
<script>
"use strict";
(() => {
// ---------------------------------------------------------------- constants
const W = 960, H = 540, PX = 24;           // canvas size, pixels per metre
const DT = 1 / 60;
const HULL_LEN = 8, RATED = 9.5;
const NEUTRAL = 0.5, ITEM_MASS = 0.07;

const LEVELS = [
  {
    name: "Kiel harbour, morning", width: 120, seed: 3, floor: [5, 9], night: false, current: 0,
    items: [{ x: 38, name: "a ship's bell" }, { x: 70, name: "a crate of letters" }],
    hints: [
      "Alternate ← and → to pedal. Hold W or S to trim the nose.",
      "Press Q to let water in and sink. E pumps it out again.",
      "Watch the cut-away in the corner: the loose water runs to the low end.",
      "Over an item, press Space to grab it. Bring it to the buoy on the surface.",
    ],
  },
  {
    name: "The outer harbour", width: 150, seed: 11, floor: [7, 13], night: false, current: 0.25,
    items: [{ x: 46, name: "an anchor" }, { x: 88, name: "a brass telescope" }, { x: 128, name: "a sailor's chest" }],
    hints: ["The hull is rated to 9.5 m. Deeper than that, be quick.", "A current pushes you gently. Mind it on the way back."],
  },
  {
    name: "Night", width: 150, seed: 29, floor: [6, 12], night: true, current: 0.1,
    items: [{ x: 40, name: "a lantern" }, { x: 84, name: "a pocket watch" }, { x: 118, name: "a ship's figurehead" }],
    hints: ["Your lamp only shows what's ahead. The buoy has a light too."],
  },
  {
    name: "Kronstadt, 6 September 1856", width: 90, seed: 5, floor: [11, 13], night: false, current: 0,
    items: [], hold: { x: 45, depth: 6, need: 26 },
    hints: ["The coronation dive. Hold the boat level at the marked depth.", "The band plays only while you hold steady."],
  },
];

// ---------------------------------------------------------------- utilities
function rng(seed) {
  let s = seed >>> 0;
  return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

// ---------------------------------------------------------------- world
let level, levelIndex, sub, floor, items, particles, kelp, fish, ships, time, state, stateTime, message, hintIndex, stats;

function buildLevel(i) {
  levelIndex = i;
  level = LEVELS[i];
  const r = rng(level.seed);
  const [lo, hi] = level.floor;
  const ph = [r() * 6, r() * 6, r() * 6];
  floor = [];
  for (let x = 0; x <= level.width; x++) {
    let d = (lo + hi) / 2 + (hi - lo) / 2 * (0.55 * Math.sin(x / 13 + ph[0]) + 0.3 * Math.sin(x / 5.3 + ph[1]) + 0.15 * Math.sin(x / 2.1 + ph[2]));
    if (level.night) d += (r() - 0.5) * 1.2;            // jagged rocks at night
    if (x < 14) d = Math.min(d, lo);                     // a shelf by the buoy
    floor.push(d);
  }
  items = level.items.map(it => ({ ...it, y: floorAt(it.x) - 0.35, carried: false, delivered: false }));
  kelp = [];
  for (let k = 0; k < level.width / 3; k++) {
    const x = r() * level.width;
    kelp.push({ x, h: 1.5 + r() * 3, ph: r() * 6 });
  }
  fish = [];
  for (let k = 0; k < 4; k++) {
    const cx = 20 + r() * (level.width - 30), cy = 2 + r() * 4;
    for (let n = 0; n < 6; n++) fish.push({ cx, cy, ox: r() * 3, oy: r() * 1.5, ph: r() * 6, sp: 0.3 + r() * 0.4 });
  }
  ships = [{ x: 22 + r() * 20, len: 18 }, { x: 70 + r() * 30, len: 24 }];
  particles = [];
  sub = {
    x: 9, y: 0.4, vx: 0, vy: 0, a: 0, va: 0, facing: 1,
    crank: 0, lastPedal: 0, trim: 0, water: 0.42, slosh: 0, vslosh: 0,
    air: 100, hull: 100, carrying: null, surfaced: true, hold: 0, flipT: 0,
  };
  time = 0; hintIndex = 0;
  stats = { delivered: 0, escapes: stats ? stats.escapes : 0 };
  setState("intro");
}

function floorAt(x) {
  const i = clamp(Math.floor(x), 0, floor.length - 2), t = clamp(x - i, 0, 1);
  return lerp(floor[i], floor[i + 1], t);
}

function setState(s) { state = s; stateTime = 0; }
function say(text, seconds = 3.5) { message = { text, until: time + seconds }; }

// ---------------------------------------------------------------- input
const keys = new Set();
const pressed = new Set();     // keys that went down this frame
addEventListener("keydown", e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(k)) e.preventDefault();
  if (!keys.has(k)) pressed.add(k);
  keys.add(k);
  audio.wake();
});
addEventListener("keyup", e => keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));
addEventListener("blur", () => keys.clear());
const down = (...ks) => ks.some(k => keys.has(k));
const hit = (...ks) => ks.some(k => pressed.has(k));

// ---------------------------------------------------------------- physics
function step(input) {
  const s = sub;
  time += DT; stateTime += DT;
  const depth = s.y;

  // Pedalling: only alternating keys turn the wheel.
  if (input.pedal && input.pedal !== s.lastPedal) {
    s.crank = Math.min(1, s.crank + 0.16);
    s.lastPedal = input.pedal;
    audio.click(s.crank);
  }
  s.crank *= Math.exp(-0.7 * DT);

  // Ballast.
  if (input.flood && s.water < 0.95) { s.water = Math.min(0.95, s.water + 0.11 * DT); if (Math.random() < 0.3) bubble(s.x, s.y - 0.6, 1); }
  if (input.pump && s.water > 0.05 && s.hull > 0) { s.water = Math.max(0.05, s.water - 0.075 * DT); if (Math.random() < 0.4) bubble(s.x - s.facing * 2, s.y, 1); }
  if (s.hull <= 0) s.water = Math.min(1, s.water + 0.06 * DT);       // breached: it floods

  // Trim weight.
  if (input.up) s.trim = Math.max(-1, s.trim - 1.1 * DT);
  if (input.down) s.trim = Math.min(1, s.trim + 1.1 * DT);

  // Turn the gear around.
  if (input.flip && s.flipT <= 0) { s.facing *= -1; s.flipT = 0.6; s.crank *= 0.3; }
  s.flipT -= DT;

  // The loose water runs to the low end and pushes it lower: the Brandtaucher's flaw.
  // At rest the water settles at slosh ≈ 1.67·angle, so its torque is ≈ 6.7·water·angle against the hull's 3.2·angle:
  // below about 48% ballast the boat rights itself; above it, it tips over by itself, faster the more water aboard.
  // Neutral buoyancy (50%) sits just past that edge, so holding level always takes a little attention.
  const accSlosh = 8 * Math.sin(s.a) - 3 * s.vslosh - 4.8 * s.slosh;
  s.vslosh += accSlosh * DT;
  s.slosh = clamp(s.slosh + s.vslosh * DT, -1, 1);
  if (Math.abs(s.slosh) === 1) s.vslosh = 0;

  const torque = -3.2 * s.a + 1.2 * s.trim + 4.0 * s.slosh * s.water - 1.4 * s.va;
  s.va += torque * DT;
  s.a = clamp(s.a + s.va * DT, -0.7, 0.7);

  // Forces.
  const cargo = s.carrying ? ITEM_MASS : 0;
  const heavy = s.water + cargo - NEUTRAL;                // >0 sinks
  const thrust = s.crank * 2.6;
  let ax = thrust * Math.cos(s.a) * s.facing - 0.9 * s.vx + level.current * 0.4;
  let ay = 4.0 * heavy + thrust * Math.sin(s.a) - 1.4 * s.vy;
  s.vx += ax * DT; s.vy += ay * DT;
  s.x = clamp(s.x + s.vx * DT, 4, level.width - 4);
  s.y += s.vy * DT;
  if (s.x <= 4 || s.x >= level.width - 4) s.vx = 0;

  // Surface.
  s.surfaced = s.y <= 0.45;
  if (s.y < 0.4) { s.y = 0.4; s.vy = Math.max(0, s.vy); s.a *= 0.9; s.va *= 0.9; }

  // Seabed collisions: nose, tail and keel.
  const half = HULL_LEN / 2;
  const pts = [
    [s.x + s.facing * half * Math.cos(s.a), s.y + half * Math.sin(s.a)],
    [s.x - s.facing * half * Math.cos(s.a), s.y - half * Math.sin(s.a)],
    [s.x, s.y + 0.8],
  ];
  for (const [px, py] of pts) {
    const f = floorAt(px);
    if (py > f) {
      const impact = Math.hypot(s.vx, s.vy);
      if (impact > 1.1) { damage((impact - 1.1) * 14); audio.thud(impact); say("The hull struck the bottom.", 2); }
      s.y -= (py - f);
      s.vy = Math.min(0, -0.2 * s.vy);
      s.vx *= 0.85;
      if (px !== s.x) s.va += (px - s.x) * s.facing > 0 ? -0.05 : 0.05;
    }
  }

  // Depth beyond the rating hurts.
  if (depth > RATED) {
    damage((depth - RATED) * 2.2 * DT);
    if (Math.random() < 0.02 + (depth - RATED) * 0.02) audio.creak();
  }

  // Air.
  if (s.surfaced) s.air = Math.min(100, s.air + 30 * DT);
  else s.air -= (0.75 + 1.4 * s.crank + (input.pump ? 1.6 : 0)) * DT;

  // Carry, grab, deliver.
  if (input.grab) {
    if (s.carrying) {
      s.carrying.carried = false; s.carrying.y = Math.min(floorAt(s.x) - 0.35, s.y + 1.4); s.carrying.x = s.x; s.carrying = null;
      audio.clunk();
    } else {
      const near = items.find(it => !it.delivered && Math.hypot(it.x - s.x, it.y - (s.y + 1.2)) < 2.4);
      if (near) { near.carried = true; s.carrying = near; audio.clunk(); say(`You have ${near.name}.`, 2.5); }
      else if (!s.surfaced) say("Nothing within reach. Get right above it.", 2);
    }
  }
  if (s.carrying) { s.carrying.x = s.x; s.carrying.y = s.y + 1.3; }
  if (s.carrying && s.surfaced && Math.abs(s.x - 6) < 7) {
    s.carrying.delivered = true; s.carrying.carried = false; s.carrying = null;
    stats.delivered++; audio.chime(); say("Delivered to the buoy.", 2.5);
  }

  // The coronation hold.
  if (level.hold) {
    const steady = Math.abs(s.y - level.hold.depth) < 0.6 && Math.abs(s.a) < 0.14 && Math.abs(s.x - level.hold.x) < 10 && !s.surfaced;
    if (steady) s.hold += DT;
    audio.band(steady, s.hold);
  }

  // Escape: by choice, or forced.
  if (!s.surfaced) {
    if (input.escape) return beginEscape("You chose to escape.");
    if (s.air <= 0) return beginEscape("The air is gone.");
    if (s.hull <= 0 && s.water >= 0.99) return beginEscape("The hull is full of water.");
  }

  // Bubbles from the propeller.
  if (s.crank > 0.2 && Math.random() < s.crank * 0.5) bubble(s.x - s.facing * half * Math.cos(s.a), s.y - half * Math.sin(s.a), 1);

  // Done?
  if (!level.hold && items.length && items.every(it => it.delivered)) setState("complete");
  if (level.hold && s.hold >= level.hold.need) setState("complete");
}

function damage(n) {
  const before = sub.hull;
  sub.hull = Math.max(0, sub.hull - n);
  if (before > 0 && sub.hull === 0) say("The hull is breached. Water is coming in. X to escape, as Bauer did.", 6);
}

function beginEscape(reason) {
  stats.escapes++;
  sub.escapeReason = reason;
  if (sub.carrying) { sub.carrying.carried = false; sub.carrying = null; }
  setState("escape");
}

function bubble(x, y, n) {
  for (let i = 0; i < n; i++) particles.push({ x: x + (Math.random() - 0.5) * 0.4, y, vx: (Math.random() - 0.5) * 0.3, vy: -0.6 - Math.random() * 0.8, life: 3 + Math.random() * 2, r: 0.05 + Math.random() * 0.08 });
}

// ---------------------------------------------------------------- sound
const audio = (() => {
  let ctx = null, on = true, master = null, band = null, bandNote = -1;
  const ensure = () => {
    if (ctx || !on) return ctx;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
    } catch (e) { ctx = null; }
    return ctx;
  };
  const tone = (f, dur, type = "sine", gain = 0.2, when = 0, slide = 0) => {
    if (!ensure()) return;
    const t = ctx.currentTime + when, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  };
  const noise = (dur, freq, gain) => {
    if (!ensure()) return;
    const b = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = b; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = gain;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  };
  // An original hymn-like tune in D major for the coronation dive (beats: 1 = quarter note).
  const HYMN = [[62, 2], [66, 1], [69, 1], [74, 2], [71, 2], [69, 1], [67, 1], [66, 1], [64, 1], [66, 4],
                [69, 2], [71, 1], [69, 1], [67, 2], [66, 2], [64, 1], [66, 1], [64, 1], [61, 1], [62, 4]];
  const hymnLen = HYMN.reduce((s, n) => s + n[1], 0);
  return {
    wake() { ensure(); if (ctx && ctx.state === "suspended") ctx.resume(); },
    toggle() { on = !on; if (master) master.gain.value = on ? 0.5 : 0; return on; },
    get on() { return on; },
    click(c) { tone(180 + c * 120, 0.05, "square", 0.04); },
    thud(v) { tone(70, 0.4, "sine", Math.min(0.5, 0.15 * v), 0, -30); noise(0.25, 400, 0.25); },
    creak() { tone(90 + Math.random() * 60, 0.6, "sawtooth", 0.05, 0, -40); },
    clunk() { tone(140, 0.15, "triangle", 0.2); noise(0.08, 1200, 0.15); },
    chime() { [74, 78, 81].forEach((n, i) => tone(440 * 2 ** ((n - 69) / 12), 1.2, "sine", 0.15, i * 0.12)); },
    bubble() { tone(600 + Math.random() * 500, 0.08, "sine", 0.03, 0, 300); },
    band(steady, held) {
      // Advance through the tune only while steady; each note sounds as you reach it.
      const beat = 0.48, pos = (held / beat) % hymnLen;
      let acc = 0, idx = 0;
      for (; idx < HYMN.length; idx++) { if (pos < acc + HYMN[idx][1]) break; acc += HYMN[idx][1]; }
      if (steady && idx !== bandNote) {
        const [n, len] = HYMN[idx];
        const f = 440 * 2 ** ((n - 69) / 12);
        tone(f, len * beat * 0.95, "triangle", 0.12);
        tone(f / 2, len * beat * 0.95, "sine", 0.07);
        bandNote = idx;
      }
      if (!steady) bandNote = -1;
    },
    reset() { bandNote = -1; },
  };
})();

// ---------------------------------------------------------------- drawing
const cv = document.getElementById("c"), g = cv.getContext("2d");
let cam = { x: 0, y: 0 };

function toScreen(x, y) { return [(x - cam.x) * PX, (y - cam.y) * PX]; }

function draw() {
  const s = sub;
  cam.x = clamp(s.x - W / PX / 2, 0, level.width - W / PX);
  cam.y = clamp(s.y - H / PX * 0.4, -3, Math.max(-3, Math.max(...floor) + 2 - H / PX));

  // Sky and water.
  const [, surfY] = toScreen(0, 0);
  const night = level.night;
  g.fillStyle = night ? "#0a1022" : "#cfe0e3";
  g.fillRect(0, 0, W, Math.max(0, surfY));
  const wg = g.createLinearGradient(0, surfY, 0, surfY + 16 * PX);
  wg.addColorStop(0, night ? "#10303c" : "#3f8a92");
  wg.addColorStop(1, night ? "#030a0e" : "#0d2a33");
  g.fillStyle = wg;
  g.fillRect(0, Math.max(0, surfY), W, H);

  // Light shafts.
  if (!night) {
    g.save(); g.globalCompositeOperation = "lighter";
    for (let i = 0; i < 6; i++) {
      const x0 = ((i * 211 + time * 6) % (W + 300)) - 150;
      g.fillStyle = "rgba(170,220,210,0.035)";
      g.beginPath(); g.moveTo(x0, surfY); g.lineTo(x0 + 60, surfY); g.lineTo(x0 + 220, H); g.lineTo(x0 + 110, H); g.fill();
    }
    g.restore();
  }

  // Ships above.
  for (const sh of ships) {
    const [x, y] = toScreen(sh.x, 0);
    g.fillStyle = night ? "#05080f" : "#3b2f26";
    g.beginPath(); g.moveTo(x, y - 6); g.lineTo(x + sh.len * PX, y - 6); g.lineTo(x + (sh.len - 2) * PX, y + 1.6 * PX); g.lineTo(x + 2 * PX, y + 1.6 * PX); g.fill();
    g.fillStyle = night ? "#05080f" : "#5a4a3a";
    g.fillRect(x + sh.len * PX * 0.45, y - 5 * PX, 4, 5 * PX);
  }

  // Surface line with small waves.
  g.strokeStyle = night ? "rgba(140,180,200,0.4)" : "rgba(255,255,255,0.7)"; g.lineWidth = 2; g.beginPath();
  for (let x = 0; x <= W; x += 8) { const wy = surfY + Math.sin(x / 40 + time * 1.5) * 2; x ? g.lineTo(x, wy) : g.moveTo(x, wy); }
  g.stroke();

  // Buoy.
  { const [x, y] = toScreen(6, 0); const bob = Math.sin(time * 2) * 3;
    g.fillStyle = "#c4674c"; g.beginPath(); g.ellipse(x, y + bob, 12, 9, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#e9e1cf"; g.fillRect(x - 2, y + bob - 26, 4, 18);
    g.fillStyle = night ? "#ffd27a" : "#e3a65b"; g.beginPath(); g.arc(x, y + bob - 28, 5, 0, Math.PI * 2); g.fill(); }

  // Fish.
  for (const f of fish) {
    const fx = f.cx + Math.sin(time * f.sp + f.ph) * 6 + f.ox, fy = f.cy + Math.cos(time * f.sp * 1.3 + f.ph) * 0.6 + f.oy;
    const dir = Math.cos(time * f.sp + f.ph) > 0 ? 1 : -1;
    const [x, y] = toScreen(fx, fy);
    g.fillStyle = "rgba(200,220,210,0.35)";
    g.beginPath(); g.ellipse(x, y, 6, 2.5, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.moveTo(x - dir * 6, y); g.lineTo(x - dir * 10, y - 3); g.lineTo(x - dir * 10, y + 3); g.fill();
  }

  // Kelp.
  g.lineWidth = 3; g.lineCap = "round";
  for (const k of kelp) {
    const base = floorAt(k.x); const [x0, y0] = toScreen(k.x, base);
    g.strokeStyle = "rgba(70,120,70,0.75)"; g.beginPath(); g.moveTo(x0, y0);
    for (let j = 1; j <= 6; j++) {
      const t = j / 6; const sway = Math.sin(time * 0.8 + k.ph + j * 0.6) * 0.5 * t;
      const [x, y] = toScreen(k.x + sway, base - k.h * t); g.lineTo(x, y);
    }
    g.stroke();
  }

  // Seabed.
  g.fillStyle = night ? "#1c1a14" : "#6b5a40";
  g.beginPath(); { const [x, y] = toScreen(0, floor[0]); g.moveTo(x, H); g.lineTo(x, y); }
  for (let i = 0; i < floor.length; i++) { const [x, y] = toScreen(i, floor[i]); g.lineTo(x, y); }
  { const [x] = toScreen(floor.length - 1, 0); g.lineTo(x, H); }
  g.fill();

  // Rated depth line.
  { const [, y] = toScreen(0, RATED); g.setLineDash([6, 8]); g.strokeStyle = "rgba(196,103,76,0.5)"; g.lineWidth = 1;
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); g.setLineDash([]);
    g.fillStyle = "rgba(196,103,76,0.8)"; g.font = "12px Georgia"; g.fillText("hull rating 9.5 m", 8, y - 4); }

  // Coronation mark.
  if (level.hold) {
    const [x, y] = toScreen(level.hold.x, level.hold.depth);
    g.strokeStyle = "rgba(233,178,59,0.8)"; g.setLineDash([4, 6]); g.lineWidth = 2;
    g.strokeRect(x - 10 * PX, y - 0.6 * PX, 20 * PX, 1.2 * PX); g.setLineDash([]);
    const [bx, by] = toScreen(level.hold.x - 8, 0);
    g.fillStyle = "#6a1f2b"; g.fillRect(bx, by - 10, 16 * PX, 10); g.fillStyle = "#e9b23b"; g.fillRect(bx, by - 13, 16 * PX, 3);
  }

  // Items.
  for (const it of items) {
    if (it.delivered) continue;
    const [x, y] = toScreen(it.x, it.y);
    g.fillStyle = "#e3a65b"; g.strokeStyle = "#3b2f26"; g.lineWidth = 2;
    g.beginPath(); g.roundRect ? g.roundRect(x - 10, y - 8, 20, 14, 3) : g.rect(x - 10, y - 8, 20, 14); g.fill(); g.stroke();
    if (!it.carried && !night) { g.fillStyle = "rgba(255,230,160,0.15)"; g.beginPath(); g.arc(x, y, 18 + Math.sin(time * 3) * 3, 0, Math.PI * 2); g.fill(); }
  }

  drawSub();

  // Particles.
  g.fillStyle = "rgba(220,240,240,0.55)";
  for (const p of particles) { const [x, y] = toScreen(p.x, p.y); g.beginPath(); g.arc(x, y, p.r * PX, 0, Math.PI * 2); g.fill(); }

  // Darkness at night, with the lamp and the buoy light cut out.
  if (night) drawNight();

  drawHud();
}

let nightLayer = null;
function drawNight() {
  if (!nightLayer) { nightLayer = document.createElement("canvas"); nightLayer.width = W; nightLayer.height = H; }
  const n = nightLayer.getContext("2d"), s = sub;
  n.globalCompositeOperation = "source-over";
  n.fillStyle = "rgba(2,6,10,0.93)"; n.fillRect(0, 0, W, H);
  n.globalCompositeOperation = "destination-out";
  const [sx, sy] = toScreen(s.x, s.y);
  const dir = s.facing, ang = s.a * dir;
  const lamp = n.createRadialGradient(sx, sy, 10, sx, sy, 340);
  lamp.addColorStop(0, "rgba(0,0,0,1)"); lamp.addColorStop(1, "rgba(0,0,0,0)");
  n.fillStyle = lamp; n.beginPath(); n.moveTo(sx, sy);
  n.arc(sx, sy, 340, (dir > 0 ? 0 : Math.PI) + ang - 0.45, (dir > 0 ? 0 : Math.PI) + ang + 0.45); n.closePath(); n.fill();
  const glow = n.createRadialGradient(sx, sy, 0, sx, sy, 90); glow.addColorStop(0, "rgba(0,0,0,0.9)"); glow.addColorStop(1, "rgba(0,0,0,0)");
  n.fillStyle = glow; n.beginPath(); n.arc(sx, sy, 90, 0, Math.PI * 2); n.fill();
  const [bx, by] = toScreen(6, -1);
  const bl = n.createRadialGradient(bx, by, 0, bx, by, 120); bl.addColorStop(0, "rgba(0,0,0,0.95)"); bl.addColorStop(1, "rgba(0,0,0,0)");
  n.fillStyle = bl; n.beginPath(); n.arc(bx, by, 120, 0, Math.PI * 2); n.fill();
  g.drawImage(nightLayer, 0, 0);
}

function drawSub() {
  const s = sub, [x, y] = toScreen(s.x, s.y);
  g.save(); g.translate(x, y); g.scale(s.facing, 1); g.rotate(s.a);
  const L = HULL_LEN * PX / 2, R = 0.9 * PX;
  // Hull.
  g.fillStyle = s.hull > 0 ? "#5d6a6b" : "#6b5550"; g.strokeStyle = "#20292b"; g.lineWidth = 2;
  g.beginPath(); g.moveTo(-L, 0); g.quadraticCurveTo(-L * 0.7, -R * 1.2, 0, -R); g.quadraticCurveTo(L * 0.85, -R * 0.9, L, 0);
  g.quadraticCurveTo(L * 0.85, R * 0.9, 0, R); g.quadraticCurveTo(-L * 0.7, R * 1.2, -L, 0); g.fill(); g.stroke();
  // Rivets.
  g.fillStyle = "#3a4546";
  for (let i = -5; i <= 5; i++) { g.beginPath(); g.arc(i * L / 6, -R * 0.55, 1.6, 0, Math.PI * 2); g.fill(); }
  // Hatch tower and portholes.
  g.fillStyle = "#4a5556"; g.fillRect(-14, -R - 12, 28, 14); g.strokeRect(-14, -R - 12, 28, 14);
  for (const px of [-L * 0.45, 0, L * 0.45]) {
    g.fillStyle = level.night ? "#ffd27a" : "#9fc7c4"; g.beginPath(); g.arc(px, 2, 5, 0, Math.PI * 2); g.fill(); g.stroke();
  }
  // Propeller.
  const spin = time * 30 * s.crank;
  g.strokeStyle = "#20292b"; g.lineWidth = 3;
  g.beginPath(); g.moveTo(-L - 4, Math.sin(spin) * 10); g.lineTo(-L - 4, -Math.sin(spin) * 10); g.stroke();
  // Lamp.
  g.fillStyle = "#e3a65b"; g.beginPath(); g.arc(L - 4, -4, 3, 0, Math.PI * 2); g.fill();
  g.restore();
  // Claw rope and carried item.
  if (s.carrying) {
    const [ix, iy] = toScreen(s.x, s.y + 1.3);
    g.strokeStyle = "#20292b"; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x, y + R * 0.9); g.lineTo(ix, iy - 8); g.stroke();
  }
}

function bar(x, y, w, h, frac, colour, label) {
  g.fillStyle = "rgba(0,0,0,0.35)"; g.fillRect(x, y, w, h);
  g.fillStyle = colour; g.fillRect(x, y, w * clamp(frac, 0, 1), h);
  g.fillStyle = "#e9e1cf"; g.font = "12px Georgia"; g.fillText(label, x, y - 4);
}

function drawHud() {
  const s = sub;
  g.fillStyle = "rgba(6,16,20,0.55)"; g.fillRect(10, 10, 250, 168);
  g.fillStyle = "#e9e1cf"; g.font = "14px Georgia";
  g.fillText(`${level.name}`, 20, 30);
  g.font = "12px Georgia"; g.fillStyle = s.y > RATED ? "#ff9a7a" : "#e9e1cf";
  g.fillText(`depth ${s.y.toFixed(1)} m${s.surfaced ? " (surfaced)" : ""}`, 20, 48);
  bar(20, 66, 105, 8, s.air / 100, s.air < 25 ? "#c4674c" : "#8fc1b5", `air ${Math.ceil(s.air)}%`);
  bar(140, 66, 105, 8, s.hull / 100, s.hull < 30 ? "#c4674c" : "#c9bda4", `hull ${Math.ceil(s.hull)}%`);
  bar(20, 94, 105, 8, s.crank, "#e3a65b", "crank");
  bar(140, 94, 105, 8, (s.trim + 1) / 2, "#9fb3b0", "trim  ↑ W · S ↓");

  // Cut-away: where the loose water is.
  const cx = 135, cy = 140, L = 100, R = 18;
  g.save(); g.translate(cx, cy); g.rotate(s.a * s.facing);
  g.strokeStyle = "#c9bda4"; g.lineWidth = 2; g.beginPath(); g.ellipse(0, 0, L, R, 0, 0, Math.PI * 2); g.stroke();
  g.clip();
  // Water surface inside stays level in the world; its height and tilt come from fill and slosh.
  g.rotate(-s.a * s.facing);
  const fill = s.water, level_ = R - fill * 2 * R, tilt = s.slosh * 14 * s.facing;
  g.fillStyle = "rgba(90,150,170,0.85)";
  g.beginPath(); g.moveTo(-L - 20, level_ - tilt); g.lineTo(L + 20, level_ + tilt); g.lineTo(L + 20, R + 40); g.lineTo(-L - 20, R + 40); g.fill();
  g.restore();
  g.fillStyle = "#9fb3b0"; g.font = "11px Georgia"; g.fillText(`ballast ${Math.round(s.water * 100)}%  · Q flood · E pump`, 30, 172);

  // Goal line.
  g.fillStyle = "#e9e1cf"; g.font = "13px Georgia";
  let goal;
  if (level.hold) goal = `Hold steady at ${level.hold.depth} m: ${Math.min(level.hold.need, s.hold).toFixed(0)} / ${level.hold.need} s`;
  else goal = `Brought up ${items.filter(i => i.delivered).length} of ${items.length}` + (s.carrying ? ` · carrying ${s.carrying.name}` : "");
  g.textAlign = "right"; g.fillText(goal, W - 14, 26); g.fillText(audio.on ? "sound on (M)" : "sound off (M)", W - 14, 44); g.textAlign = "left";

  // Message or hint.
  let text = message && time < message.until ? message.text : null;
  if (!text && state === "play" && level.hints[hintIndex] && stateTime > 1 + hintIndex * 7) { say(level.hints[hintIndex], 6.5); hintIndex++; text = message.text; }
  if (text) {
    g.font = "15px Georgia"; const w = g.measureText(text).width + 30;
    g.fillStyle = "rgba(6,16,20,0.75)"; g.fillRect(W / 2 - w / 2, H - 52, w, 32);
    g.fillStyle = "#e9e1cf"; g.textAlign = "center"; g.fillText(text, W / 2, H - 31); g.textAlign = "left";
  }

  if (state !== "play") drawCard();
}

function card(title, lines, prompt) {
  g.fillStyle = "rgba(6,16,20,0.82)"; g.fillRect(0, 0, W, H);
  g.textAlign = "center"; g.fillStyle = "#e9e1cf";
  g.font = "34px Georgia"; g.fillText(title, W / 2, H / 2 - 70);
  g.font = "16px Georgia"; g.fillStyle = "#c9d6d2";
  lines.forEach((l, i) => g.fillText(l, W / 2, H / 2 - 24 + i * 26));
  if (prompt) { g.fillStyle = "#e3a65b"; g.font = "15px Georgia"; g.fillText(prompt, W / 2, H / 2 + 40 + lines.length * 26); }
  g.textAlign = "left";
}

function drawCard() {
  if (state === "title") card("Fire-Diver", [
    "Kiel, 1850. A submarine driven by men on tread wheels.",
    "No ballast tanks: the water sloshes loose in the bottom of the hull.",
    "Bring up what the harbour swallowed. Come back alive.",
  ], "Press Enter to begin");
  else if (state === "intro") card(`${levelIndex + 1}. ${level.name}`, level.hold
    ? ["The coronation of Alexander II.", "Bauer dives while the band plays the anthem below the water.", "Hold level at the mark; the music plays only while you're steady."]
    : [`${items.length} things to bring up to the buoy.`, level.night ? "It's dark. Your lamp shows the way ahead." : "The water is clear today."], "Press Enter");
  else if (state === "escape") card("You escaped", [
    sub.escapeReason,
    "You let the sea in until the pressure inside matched the water,",
    "opened the hatch, and swam up. Bauer did the same in 1851.",
  ], "Press Enter to dive again");
  else if (state === "complete") card(level.hold ? "The tune is finished" : "Harbour cleared", level.hold
    ? ["The band played to the end. Above, the coronation goes on.", `Escapes along the way: ${stats.escapes}.`]
    : [`Everything is back on the surface.`, `Air left ${Math.ceil(sub.air)}% · hull ${Math.ceil(sub.hull)}%`],
    levelIndex < LEVELS.length - 1 ? "Press Enter for the next dive" : "Press Enter");
  else if (state === "end") card("The end", [
    "Brandtaucher lay on the bottom of Kiel harbour for 36 years.",
    "It was raised in 1887 and is in a museum in Dresden today:",
    "the oldest surviving submarine in the world.",
    `You escaped ${stats.escapes} time${stats.escapes === 1 ? "" : "s"}. Bauer escaped twice.`,
  ], "Press Enter to play again");
}

// ---------------------------------------------------------------- loop
function readInput() {
  let pedal = 0;
  if (hit("ArrowLeft", "a")) pedal = 1;
  if (hit("ArrowRight", "d")) pedal = 2;
  return {
    pedal,
    up: down("w", "ArrowUp"), down: down("s", "ArrowDown"),
    flood: down("q"), pump: down("e"),
    flip: hit("f"), grab: hit(" "), escape: hit("x"),
  };
}

function update() {
  if (hit("m")) audio.toggle();
  const go = hit("Enter");
  if (state === "title" && go) setState("intro");
  else if (state === "intro" && go) { setState("play"); audio.reset(); }
  else if (state === "escape" && go) { const e = stats.escapes; buildLevel(levelIndex); stats.escapes = e; setState("play"); }
  else if (state === "complete" && go) {
    if (levelIndex < LEVELS.length - 1) { const e = stats.escapes; buildLevel(levelIndex + 1); stats.escapes = e; }
    else setState("end");
  } else if (state === "end" && go) { stats = null; buildLevel(0); setState("title"); }
  else if (state === "play") step(readInput());

  for (const p of particles) { p.x += p.vx * DT; p.y += p.vy * DT; p.life -= DT; if (p.y < 0.1) p.life = 0; }
  particles = particles.filter(p => p.life > 0);
  pressed.clear();
}

let acc = 0, last = performance.now();
function frame(now) {
  acc += Math.min(0.25, (now - last) / 1000); last = now;
  while (acc >= DT) { update(); acc -= DT; }
  draw();
  requestAnimationFrame(frame);
}

cv.addEventListener("pointerdown", () => { cv.focus(); audio.wake(); });

// Playtesting hook: only on index.html#debug. Lets a script drive the physics directly.
if (location.hash === "#debug") {
  window.fd = {
    get sub() { return sub; }, get items() { return items; }, get state() { return state; }, get level() { return levelIndex; },
    get hold() { return LEVELS[levelIndex].hold; },
    load(i) { stats = null; buildLevel(i); setState("play"); },
    step(input = {}, n = 1) { for (let k = 0; k < n; k++) step({ pedal: 0, ...input }); return { ...sub, carrying: !!sub.carrying }; },
    floorAt,
  };
}

stats = null;
buildLevel(0);
setState("title");
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
